services:
  nats:
    image: nats:2.11-alpine
    ports:
      - "127.0.0.1:4222:4222"
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  nats-data:
